name: Android build and signed release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MUSIC_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      MUSIC_KEYSTORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      MUSIC_KEY_ALIAS: debugging
      MUSIC_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare release signing key
        if: ${{ env.MUSIC_KEYSTORE_BASE64 != '' && env.MUSIC_KEYSTORE_PASSWORD != '' && env.MUSIC_KEY_ALIAS != '' && env.MUSIC_KEY_PASSWORD != '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/music-signing"
          echo "$MUSIC_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/music-signing/release.p12"
          echo "MUSIC_KEYSTORE_FILE=$RUNNER_TEMP/music-signing/release.p12" >> "$GITHUB_ENV"

      - name: Build signed release APK and AAB
        if: ${{ env.MUSIC_KEYSTORE_FILE != '' }}
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Upload signed APK and AAB
        if: ${{ env.MUSIC_KEYSTORE_FILE != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Music-signed-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          retention-days: 3
          if-no-files-found: error

      - name: Explain missing signing secrets
        if: ${{ env.MUSIC_KEYSTORE_FILE == '' }}
        run: echo "Release signing skipped. Add KEYSTORE_BASE64, STORE_PASSWORD and KEY_PASSWORD repository secrets."
