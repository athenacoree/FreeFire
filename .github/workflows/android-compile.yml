name: Android test build (signed debug APK)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  assemble-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager --channel=3 "platforms;android-37" "build-tools;36.0.0"

      - name: Build test APK (debug)
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload signed test APK
        uses: actions/upload-artifact@v4
        with:
          name: Music-test-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error
